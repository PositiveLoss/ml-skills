name: Release skills

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install packaging dependencies
        run: python -m pip install -r requirements-ci.txt

      - name: Test packaging
        run: python -B -m unittest discover -s tests -v

      - name: Validate and build ZIP
        run: python -B scripts/release_skills.py --output dist/machine-learning-skills.zip

      - name: Attach ZIP to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/machine-learning-skills.zip --clobber
